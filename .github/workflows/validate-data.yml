name: Validate TOEIC dictionary

on:
  push:
    branches: [main, master]
    paths:
      - "data/**"
      - "patches/**"
      - "assets/**"
      - "tools/**"
      - "sw.js"
      - "index.html"
      - "manifest.webmanifest"
      - "docs/**"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "patches/**"
      - "assets/**"
      - "tools/**"
      - "sw.js"
      - "index.html"
      - "manifest.webmanifest"
      - "docs/**"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Python syntax check
        run: python -m py_compile tools/validate-data.py tools/validate-learning-content.py tools/audit-toeic-coverage.py tools/audit-question-evidence.py tools/audit-distractors.py tools/sync-version.py tools/patch-data.py tools/tests/test_vocabulary_detail_examples.py tools/tests/test_legacy_collocation_cleanup.py tools/validate-part1-photo-assets.py tools/tests/test_part1_photo_assets.py
      - name: Unit tests — baseline_ids
        run: python -m unittest discover -s tools/tests -p 'test_baseline_ids.py' -v
      - name: Unit tests — patch_data
        run: python -m unittest discover -s tools/tests -p 'test_patch_data.py' -v
      - name: Unit tests — sync_version
        run: python -m unittest discover -s tools/tests -p 'test_sync_version.py' -v
        timeout-minutes: 15
      - name: Unit tests — validator
        run: python -m unittest discover -s tools/tests -p 'test_validator.py' -v
        timeout-minutes: 15
      - name: Unit tests — learning_content
        run: python -m unittest discover -s tools/tests -p 'test_learning_content.py' -v
      - name: Unit tests — dashboard_layout
        run: python -m unittest discover -s tools/tests -p 'test_dashboard_layout.py' -v
      - name: Unit tests — design_system
        run: python -m unittest discover -s tools/tests -p 'test_design_system.py' -v
      - name: Unit tests — question_evidence
        run: python -m unittest discover -s tools/tests -p 'test_question_evidence.py' -v
      - name: Unit tests — distractor_quality
        run: python -m unittest discover -s tools/tests -p 'test_distractor_quality.py' -v
      - name: Unit tests — choice_history
        run: python -m unittest discover -s tools/tests -p 'test_choice_history.py' -v
      - name: Unit tests — learning_detail_scope
        run: python -m unittest discover -s tools/tests -p 'test_learning_detail_scope.py' -v
      - name: Unit tests — choice_identity
        run: python -m unittest discover -s tools/tests -p 'test_choice_identity.py' -v
      - name: Unit tests — answer_position_balance
        run: python -m unittest discover -s tools/tests -p 'test_answer_position_balance.py' -v
      - name: Unit tests — remaining_content_review
        run: python -m unittest discover -s tools/tests -p 'test_remaining_content_review.py' -v
      - name: Unit tests — part1_photo_assets
        run: python -m unittest discover -s tools/tests -p 'test_part1_photo_assets.py' -v
      - name: Unit tests — vocabulary_detail_examples
        run: python -m unittest discover -s tools/tests -p 'test_vocabulary_detail_examples.py' -v
      - name: Unit tests — legacy_collocation_cleanup
        run: python -m unittest discover -s tools/tests -p 'test_legacy_collocation_cleanup.py' -v
      - name: Validate vocabulary data (structure, ID integrity, APP_SHELL, ratchet baseline)
        run: python tools/validate-data.py
      - name: Validate TOEIC learning content (Listening/Reading/Grammar)
        run: python tools/validate-learning-content.py
      - name: Validate licensed Part 1 photo binaries and attribution
        run: python tools/validate-part1-photo-assets.py
      - name: Generate TOEIC coverage report
        run: python tools/audit-toeic-coverage.py
      - name: Generate answer-to-source evidence audit
        run: python tools/audit-question-evidence.py
      - name: Audit distractor plausibility and answer-index safety
        run: python tools/audit-distractors.py
      - name: Version sync check
        run: python tools/sync-version.py --check
      - name: JavaScript syntax check
        run: |
          node --check sw.js
          for f in assets/js/*.js; do cp "$f" "/tmp/$(basename "$f" .js).mjs"; node --check "/tmp/$(basename "$f" .js).mjs"; done
          node tools/tests/runtime-render-smoke.mjs
          node tools/tests/listening-tts-regression.mjs
          node tools/tests/mock-exam-engine.mjs
          node tools/tests/mock-ui-integrity.mjs
