  package-candidate:
    name: Package and verify v2.95.66 release artifacts
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python for release packaging
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: "3.12"
      - name: Rebuild and verify exact v2.95.65 predecessor
        env:
          BASE_COMMIT: bfb28d63669508dc8fd766802c1203f6a2e86087
          BASE_SHA256: a1b95e807e08052bfa599a08ff88bc3237ae086688557ce3ae77b78e814814fb
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          repo = Path.cwd()
          chunks = sorted((repo / ".github/package-manifests").glob("v2.95.65-paths-list.part*.txt"))
          if len(chunks) != 10:
              raise RuntimeError(f"Curated v2.95.65 path manifest has {len(chunks)} chunks; expected 10")
          paths = [
              line.strip()
              for chunk in chunks
              for line in chunk.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          base_commit = os.environ["BASE_COMMIT"]
          expected_sha = os.environ["BASE_SHA256"]
          if len(paths) != 779 or len(set(paths)) != 779:
              raise RuntimeError(f"Curated v2.95.65 path manifest must contain 779 unique paths; found {len(paths)}")

          output = Path(os.environ["RUNNER_TEMP"]) / "TOEIC_Dictionary_v2.95.65_FullSource.zip"
          prefix = "Toeic_Dictionary_v2.95.65/"
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for rel_path in paths:
                  content = subprocess.check_output(["git", "show", f"{base_commit}:{rel_path}"], cwd=repo)
                  archive.writestr(prefix + rel_path, content)

          actual_sha = hashlib.sha256(output.read_bytes()).hexdigest()
          if actual_sha != expected_sha:
              raise RuntimeError(
                  f"v2.95.65 baseline archive mismatch: expected {expected_sha}, got {actual_sha}. "
                  "Do not package from the larger GitHub repository tree."
              )
          with zipfile.ZipFile(output) as archive:
              if archive.testzip() is not None:
                  raise RuntimeError("Rebuilt v2.95.65 baseline ZIP CRC failed")
              roots = {name.split("/", 1)[0] for name in archive.namelist()}
              if roots != {"Toeic_Dictionary_v2.95.65"} or len(archive.namelist()) != 779:
                  raise RuntimeError("Rebuilt v2.95.65 baseline root or inventory is invalid")
          print(f"PASS: exact v2.95.65 baseline reconstructed from {len(paths)} curated files; SHA-256 {actual_sha}")
          PY
      - name: Build curated FullSource, Patch and verify exact replay
        env:
          BASE_COMMIT: bfb28d63669508dc8fd766802c1203f6a2e86087
          BASE_SHA256: a1b95e807e08052bfa599a08ff88bc3237ae086688557ce3ae77b78e814814fb
          TARGET_VERSION: 2.95.66
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          python - <<'PY'
          import hashlib
          import os
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          repo = Path.cwd()
          output = repo / "release-artifacts"
          version = os.environ["TARGET_VERSION"]
          base_commit = os.environ["BASE_COMMIT"]
          target_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=repo, text=True).strip()
          baseline_zip = Path(os.environ["RUNNER_TEMP"]) / "TOEIC_Dictionary_v2.95.65_FullSource.zip"
          target_zip = output / f"TOEIC_Dictionary_v{version}_FullSource.zip"
          patch_zip = output / f"TOEIC_Dictionary_v{version}_Patch_From_v2.95.65.zip"

          chunks = sorted((repo / ".github/package-manifests").glob("v2.95.65-paths-list.part*.txt"))
          if len(chunks) != 10:
              raise RuntimeError(f"Curated v2.95.65 path manifest has {len(chunks)} chunks; expected 10")
          base_paths = [
              line.strip()
              for chunk in chunks
              for line in chunk.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if len(base_paths) != 779 or len(set(base_paths)) != 779:
              raise RuntimeError("Curated v2.95.65 path manifest must contain 779 unique paths")
          manifest = {"version": "2.95.65", "count": len(base_paths), "paths": base_paths}
          base_set = set(base_paths)

          def digest(raw):
              return hashlib.sha256(raw).hexdigest()

          def excluded(path):
              parts = Path(path).parts
              return (
                  not path
                  or ".github/package-manifests" in parts
                  or any(part in {".git", "logs", "__pycache__", ".pytest_cache", "node_modules", "release", "releases"} or part.startswith("release_") for part in parts)
                  or Path(path).suffix.lower() in {".zip", ".bundle", ".log", ".pyc", ".tmp", ".sha256"}
              )

          status_lines = subprocess.check_output(
              ["git", "diff", "--name-status", "--no-renames", base_commit, target_commit],
              cwd=repo, text=True
          ).splitlines()
          added_paths = []
          for line in status_lines:
              fields = line.split("\t")
              if len(fields) != 2:
                  raise RuntimeError(f"Unexpected Git name-status row: {line}")
              status, rel_path = fields
              if status == "A" and rel_path not in base_set and not excluded(rel_path):
                  added_paths.append(rel_path)

          # Keep the exact approved 779-file release inventory, overlay current bytes
          # for those paths, and append only new package-eligible paths from this PR.
          target_paths = []
          for rel_path in base_paths:
              exists = subprocess.run(
                  ["git", "cat-file", "-e", f"{target_commit}:{rel_path}"],
                  cwd=repo, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              ).returncode == 0
              if exists:
                  target_paths.append(rel_path)
          target_paths.extend(sorted(set(added_paths)))
          target_contents = {
              rel_path: subprocess.check_output(["git", "show", f"{target_commit}:{rel_path}"], cwd=repo)
              for rel_path in target_paths
          }
          prefix = f"Toeic_Dictionary_v{version}/"
          with zipfile.ZipFile(target_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for rel_path in target_paths:
                  archive.writestr(prefix + rel_path, target_contents[rel_path])

          if zipfile.ZipFile(target_zip).testzip() is not None:
              raise RuntimeError("Candidate FullSource ZIP CRC failed")
          with zipfile.ZipFile(target_zip) as archive:
              names = archive.namelist()
              roots = {name.split("/", 1)[0] for name in names}
              if roots != {prefix.rstrip("/")}:
                  raise RuntimeError(f"Candidate FullSource has unexpected root(s): {roots}")
              if len(names) != len(target_paths) or len(set(names)) != len(names):
                  raise RuntimeError("Candidate FullSource inventory has duplicate or missing paths")

          # Construct a binary Git Patch from the exact extracted release baseline,
          # not from the larger repository tree (which contains extra archived docs).
          with tempfile.TemporaryDirectory(prefix="toeic-release-patch-") as temporary:
              root = Path(temporary)
              base_extract = root / "base"
              target_extract = root / "target"
              base_extract.mkdir()
              target_extract.mkdir()
              with zipfile.ZipFile(baseline_zip) as archive:
                  archive.extractall(base_extract)
              with zipfile.ZipFile(target_zip) as archive:
                  archive.extractall(target_extract)
              base_root = base_extract / "Toeic_Dictionary_v2.95.65"
              target_root = target_extract / f"Toeic_Dictionary_v{version}"
              assert base_root.is_dir() and target_root.is_dir()

              subprocess.run(["git", "init", "-q"], cwd=base_root, check=True)
              subprocess.run(["git", "config", "user.name", "TOEIC Release Builder"], cwd=base_root, check=True)
              subprocess.run(["git", "config", "user.email", "release-builder@users.noreply.github.com"], cwd=base_root, check=True)
              subprocess.run(["git", "add", "-f", "-A"], cwd=base_root, check=True)
              subprocess.run(["git", "commit", "-q", "-m", "v2.95.65 exact FullSource baseline"], cwd=base_root, check=True)

              target_snapshot = {
                  p.relative_to(target_root).as_posix(): p.read_bytes()
                  for p in target_root.rglob("*") if p.is_file()
              }
              for p in base_root.rglob("*"):
                  if p.is_file() and ".git" not in p.relative_to(base_root).parts:
                      if p.relative_to(base_root).as_posix() not in target_snapshot:
                          p.unlink()
              for rel_path, content in target_snapshot.items():
                  dest = base_root / rel_path
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(content)
              subprocess.run(["git", "add", "-f", "-A"], cwd=base_root, check=True)
              diff = subprocess.check_output(["git", "diff", "--binary", "HEAD"], cwd=base_root)
              if not diff:
                  raise RuntimeError("No curated source changes were generated for the Patch")

              patch_manifest = {
                  "schemaVersion": 1,
                  "baseVersion": "2.95.65",
                  "targetVersion": version,
                  "baseFullSourceSha256": manifest["sha256"],
                  "targetFullSourceSha256": digest(target_zip.read_bytes()),
                  "patchDiffSha256": digest(diff),
                  "baseFileCount": manifest["count"],
                  "targetFileCount": len(target_paths),
                  "addedPackagePaths": sorted(set(added_paths)),
                  "baseCommit": base_commit,
                  "targetCommit": target_commit,
              }
              patch_readme = (
                  f"# TOEIC Dictionary v{version} Patch\n\n"
                  "Apply this binary Git Patch to a clean extraction of the exact approved predecessor FullSource.\n\n"
                  f"- Base version: v2.95.65\n- Base FullSource SHA-256: {manifest['sha256']}\n"
                  f"- Target version: v{version}\n- Target FullSource SHA-256: {patch_manifest['targetFullSourceSha256']}\n"
                  f"- Target Git commit: {target_commit}\n- Target package files: {len(target_paths)}\n"
                  f"- Binary diff SHA-256: {patch_manifest['patchDiffSha256']}\n"
              )
              with zipfile.ZipFile(patch_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
                  archive.writestr("PATCH_README.md", patch_readme)
                  archive.writestr("PATCH_MANIFEST.json", json.dumps(patch_manifest, ensure_ascii=False, indent=2) + "\n")
                  archive.writestr("BASE_SHA256.txt", manifest["sha256"] + "  TOEIC_Dictionary_v2.95.65_FullSource.zip\n")
                  archive.writestr("patch.diff", diff)

              if zipfile.ZipFile(patch_zip).testzip() is not None:
                  raise RuntimeError("Patch ZIP CRC failed")
              with zipfile.ZipFile(patch_zip) as archive:
                  if set(archive.namelist()) != {"PATCH_README.md", "PATCH_MANIFEST.json", "BASE_SHA256.txt", "patch.diff"}:
                      raise RuntimeError("Patch ZIP does not have the exact four-member contract")

              replay_dir = root / "replay"
              replay_dir.mkdir()
              with zipfile.ZipFile(baseline_zip) as archive:
                  archive.extractall(replay_dir)
              replay_root = replay_dir / "Toeic_Dictionary_v2.95.65"
              diff_path = root / "candidate.patch"
              diff_path.write_bytes(diff)
              subprocess.run(["git", "apply", "--check", str(diff_path)], cwd=replay_root, check=True)
              subprocess.run(["git", "apply", str(diff_path)], cwd=replay_root, check=True)

              def snapshot(folder):
                  return {
                      p.relative_to(folder).as_posix(): digest(p.read_bytes())
                      for p in folder.rglob("*") if p.is_file()
                  }

              replayed = snapshot(replay_root)
              packaged = snapshot(target_root)
              assert replayed.keys() == packaged.keys(), "Patch replay inventory mismatch"
              mismatched = sorted(path for path in packaged if replayed[path] != packaged[path])
              assert not mismatched, f"Patch replay byte mismatch: {mismatched[:20]}"
              replay_count = len(packaged)

          full_sha = digest(target_zip.read_bytes())
          patch_sha = digest(patch_zip.read_bytes())
          (output / "TOEIC_Dictionary_v2.95.66_FullSource.zip.sha256").write_text(
              f"{full_sha}  TOEIC_Dictionary_v2.95.66_FullSource.zip\n", encoding="utf-8"
          )
          (output / "TOEIC_Dictionary_v2.95.66_Patch_From_v2.95.65.zip.sha256").write_text(
              f"{patch_sha}  TOEIC_Dictionary_v2.95.66_Patch_From_v2.95.65.zip\n", encoding="utf-8"
          )
          verification = (
              "# Package Verification — TOEIC Dictionary v2.95.66\n\n"
              f"- Exact predecessor FullSource SHA-256: {manifest['sha256']} (779 curated files verified by rebuilt ZIP hash).\n"
              f"- Candidate FullSource SHA-256: {full_sha}.\n"
              f"- Candidate FullSource ZIP CRC: PASS; files: {len(target_paths)}.\n"
              f"- Patch SHA-256: {patch_sha}; Patch ZIP CRC: PASS; four members: PASS.\n"
              "- Exact predecessor replay: git apply --check PASS; git apply PASS.\n"
              f"- Replay comparison: {replay_count}/{replay_count} files byte-identical; 0 missing/extra/changed.\n"
              f"- Baseline Git commit: {base_commit}; candidate Git commit: {target_commit}.\n"
          )
          (output / "PACKAGE_VERIFICATION_v2.95.66.md").write_text(verification, encoding="utf-8")
          print(verification)
          print(f"FullSource SHA-256: {full_sha}")
          print(f"Patch SHA-256: {patch_sha}")
          PY
          unzip -t "release-artifacts/TOEIC_Dictionary_v2.95.66_FullSource.zip"
          unzip -t "release-artifacts/TOEIC_Dictionary_v2.95.66_Patch_From_v2.95.65.zip"
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: TOEIC_Dictionary_v2.95.66_Verified_Release
          path: release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
