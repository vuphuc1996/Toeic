name: Validate TOEIC dictionary

on:
  push:
    branches: [main, master, candidate]
    paths:
      - "data/**"
      - "design/**"
      - "patches/**"
      - "patches-related-terms/**"
      - "assets/**"
      - "tools/**"
      - "sw.js"
      - "index.html"
      - "manifest.webmanifest"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - "server.js"
      - "package.json"
      - "metadata.json"
      - "README.md"
      - ".env.example"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "design/**"
      - "patches/**"
      - "patches-related-terms/**"
      - "assets/**"
      - "tools/**"
      - "sw.js"
      - "index.html"
      - "manifest.webmanifest"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - "server.js"
      - "package.json"
      - "metadata.json"
      - "README.md"
      - ".env.example"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
