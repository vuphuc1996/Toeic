name: Validate TOEIC dictionary

on:
  push:
    branches: [main, master]
    paths:
      - "data/**"
      - "design/**"
      - "patches/**"
      - "patches-related-terms/**"
      - "assets/**"
      - "tools/**"
      - "sw.js"
      - "index.html"
      - "manifest.webmanifest"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "design/**"
      - "patches/**"
      - "patches-related-terms/**"
      - "assets/**"
      - "tools/**"
      - "sw.js"
      - "index.html"
      - "manifest.webmanifest"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
